<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>দেশসেরা শীর্ষ সংবাদ | অটোমেটেড নিউজ</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts for Bengali -->
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Hind Siliguri', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- Header -->
  <header class="bg-red-600 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">শীর্ষ সংবাদ ডাইজেস্ট</h1>
        <p class="text-xs text-red-100">স্বয়ংক্রিয়ভাবে সংগৃহীত লেটেস্ট আপডেট</p>
      </div>
      <button onclick="fetchTopNews()" class="bg-red-700 hover:bg-red-800 text-white text-sm px-3 py-1.5 rounded-lg transition flex items-center gap-1 shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        রিফ্রেশ
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6 pb-2 border-b border-slate-200">
      <h2 class="text-lg font-bold text-slate-700 flex items-center gap-2">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-red-600 animate-pulse"></span>
        লাইভ শীর্ষ ১০ শিরোনাম
      </h2>
      <span id="update-time" class="text-xs text-slate-400">আপডেট হচ্ছে...</span>
    </div>

    <!-- News List Container -->
    <div id="news-container" class="space-y-3">
      <!-- Loading Skeleton -->
      <div class="animate-pulse space-y-3">
        <div class="h-16 bg-slate-200 rounded-xl"></div>
        <div class="h-16 bg-slate-200 rounded-xl"></div>
        <div class="h-16 bg-slate-200 rounded-xl"></div>
      </div>
    </div>
  </main>

  <!-- Script to Auto Fetch News -->
  <script>
    // শীর্ষ নিউজ পোর্টালের আরএসএস ফিড (এখানে উদাহরণ হিসেবে বিবিসি বাংলা দেওয়া হয়েছে)
    const RSS_URL = 'https://feeds.bbci.co.uk/bengali/rss.xml';
    const API_ENDPOINT = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(RSS_URL)}`;

    async function fetchTopNews() {
      const container = document.getElementById('news-container');
      const timeLabel = document.getElementById('update-time');
      
      container.innerHTML = `
        <div class="text-center py-12 text-slate-400">
          <svg class="animate-spin h-6 w-6 mx-auto mb-2 text-red-600" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          সংবাদ লোড হচ্ছে...
        </div>
      `;

      try {
        const res = await fetch(API_ENDPOINT);
        const data = await res.json();

        if (data.status === 'ok') {
          // শীর্ষ ১০টি সংবাদ ফিল্টার করা
          const top10 = data.items.slice(0, 10);
          
          container.innerHTML = top10.map((item, index) => {
            const pubDate = new Date(item.pubDate).toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });
            
            return `
              <a href="${item.link}" target="_blank" rel="noopener noreferrer" 
                 class="group block bg-white p-4 rounded-xl shadow-sm border border-slate-100 hover:border-red-200 hover:shadow-md transition duration-200">
                <div class="flex items-start gap-4">
                  <span class="flex-shrink-0 w-8 h-8 rounded-full bg-red-50 text-red-600 font-bold flex items-center justify-center text-sm group-hover:bg-red-600 group-hover:text-white transition">
                    ${index + 1}
                  </span>
                  <div class="flex-1 min-w-0">
                    <h3 class="text-base font-semibold text-slate-800 group-hover:text-red-600 transition leading-snug line-clamp-2">
                      ${item.title}
                    </h3>
                    <div class="mt-1 flex items-center gap-3 text-xs text-slate-400">
                      <span>${pubDate}</span>
                      <span>•</span>
                      <span class="text-slate-500 font-medium">মূল প্রতিবেদন পড়ুন →</span>
                    </div>
                  </div>
                </div>
              </a>
            `;
          }).join('');

          timeLabel.innerText = 'সর্বশেষ আপডেট: ' + new Date().toLocaleTimeString('bn-BD');
        } else {
          throw new Error('News fetch failed');
        }
      } catch (err) {
        container.innerHTML = `
          <div class="bg-red-50 text-red-600 p-4 rounded-xl text-center text-sm border border-red-100">
            সংবাদ লোড করতে সমস্যা হয়েছে। অনুগ্রহ করে কিছুক্ষণ পর আবার চেষ্টা করুন।
          </div>
        `;
      }
    }

    // পেজ লোড হলে কল হবে
    fetchTopNews();

    // প্রতি ১০ মিনিট পর পর স্বয়ংক্রিয়ভাবে রিফ্রেশ হবে (600000 ms)
    setInterval(fetchTopNews, 600000);
  </script>
</body>
</html>
