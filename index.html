<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>শীর্ষ ১০ পত্রিকার প্রধান শিরোনাম</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- বাংলা ফন্ট -->
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Hind Siliguri', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen antialiased">

  <!-- Header -->
  <header class="bg-slate-900 text-white sticky top-0 z-50 shadow-md border-b border-slate-800">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-xl sm:text-2xl font-bold tracking-tight flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-rose-600 animate-pulse"></span>
          ১০ পত্রিকার প্রধান শিরোনাম
        </h1>
        <p class="text-xs text-slate-400 mt-0.5">দেশের সেরা ১০টি সংবাদপত্রের এক পলকের বুলেটিন</p>
      </div>
      <button onclick="fetchTop10Papers()" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 text-xs sm:text-sm font-semibold px-3.5 py-2 rounded-xl border border-slate-700 transition flex items-center gap-1.5 shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        <span>রিফ্রেশ</span>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
    <div class="flex items-center justify-between mb-6 pb-2 border-b border-slate-200">
      <div class="text-sm font-semibold text-slate-600 flex items-center gap-2">
        <span>শীর্ষ পত্রিকার লিড নিউজ</span>
        <span id="count-badge" class="text-xs bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full font-medium">লোড হচ্ছে...</span>
      </div>
      <span id="update-time" class="text-xs text-slate-500 bg-white border border-slate-200 px-3 py-1 rounded-full shadow-sm">
        আপডেট হচ্ছে...
      </span>
    </div>

    <!-- News Grid Container -->
    <div id="news-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="col-span-full py-16 text-center text-slate-400">
        <svg class="animate-spin h-8 w-8 mx-auto mb-3 text-rose-600" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
        ১০টি পত্রিকা থেকে প্রধান খবর সংগ্রহ করা হচ্ছে...
      </div>
    </div>
  </main>

  <script>
    // গুগল নিউজের মাধ্যমে ১০টি শীর্ষ পত্রিকার আনব্লকেবল আরএসএস সোর্স
    const NEWSPAPERS = [
      { id: 1, name: 'প্রথম আলো', badge: 'bg-blue-50 text-blue-700 border-blue-200', domain: 'prothomalo.com' },
      { id: 2, name: 'বিবিসি বাংলা', badge: 'bg-rose-50 text-rose-700 border-rose-200', domain: 'bbc.com/bengali' },
      { id: 3, name: 'ডেইলি স্টার (বাংলা)', badge: 'bg-amber-50 text-amber-800 border-amber-200', domain: 'bangla.thedailystar.net' },
      { id: 4, name: 'বিডিনিউজ২৪', badge: 'bg-emerald-50 text-emerald-700 border-emerald-200', domain: 'bangla.bdnews24.com' },
      { id: 5, name: 'যুগান্তর', badge: 'bg-purple-50 text-purple-700 border-purple-200', domain: 'jugantor.com' },
      { id: 6, name: 'ইত্তেফাক', badge: 'bg-sky-50 text-sky-700 border-sky-200', domain: 'ittefaq.com.bd' },
      { id: 7, name: 'কালের কণ্ঠ', badge: 'bg-red-50 text-red-700 border-red-200', domain: 'kalerkantho.com' },
      { id: 8, name: 'সমকাল', badge: 'bg-indigo-50 text-indigo-700 border-indigo-200', domain: 'samakal.com' },
      { id: 9, name: 'জাগোনিউজ২৪', badge: 'bg-orange-50 text-orange-700 border-orange-200', domain: 'jagonews24.com' },
      { id: 10, name: 'ঢাকা পোস্ট', badge: 'bg-teal-50 text-teal-700 border-teal-200', domain: 'dhakapost.com' }
    ];

    function toBnNum(num) {
      const bn = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
      return String(num).replace(/[0-9]/g, d => bn[d]);
    }

    function formatBengaliTime(dateObj) {
      if (!dateObj || isNaN(dateObj.getTime())) return 'সাম্প্রতিক';
      let hours = dateObj.getHours();
      const minutes = dateObj.getMinutes().toString().padStart(2, '0');
      const isPM = hours >= 12;
      hours = hours % 12 || 12;
      return `${toBnNum(hours.toString().padStart(2, '0'))}:${toBnNum(minutes)} ${isPM ? 'PM' : 'AM'}`;
    }

    // নির্দিষ্ট ডোমেইনের জন্য গুগল নিউজ থেকে সংবাদ ফেচ করা
    async function fetchPaperNews(paper) {
      // গুগল নিউজের নির্দিষ্ট সাইট সার্চ কুয়েরি
      const query = encodeURIComponent(`site:${paper.domain}`);
      const googleRss = `https://news.google.com/rss/search?q=${query}&hl=bn&gl=BD&ceid=BD:bn`;
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(googleRss)}`;

      try {
        const res = await fetch(apiUrl);
        const data = await res.json();

        if (data.status === 'ok' && data.items && data.items.length > 0) {
          const leadItem = data.items[0];
          
          // গুগল নিউজের টাইটেলের শেষে থাকা ' - পত্রিকার নাম' অংশটি মুছে ক্লিন করা
          let cleanTitle = leadItem.title.replace(new RegExp(`\\s*-\\s*.*$`), '').trim();

          return {
            paperName: paper.name,
            badge: paper.badge,
            title: cleanTitle,
            link: leadItem.link,
            pubDate: new Date(leadItem.pubDate.replace(/-/g, '/'))
          };
        }
      } catch (err) {
        console.error(`Failed to load: ${paper.name}`);
      }
      return null;
    }

    async function fetchTop10Papers() {
      const container = document.getElementById('news-grid');
      const timeLabel = document.getElementById('update-time');
      const countBadge = document.getElementById('count-badge');

      container.innerHTML = `
        <div class="col-span-full py-16 text-center text-slate-400">
          <svg class="animate-spin h-8 w-8 mx-auto mb-3 text-rose-600" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          ১০টি শীর্ষ পত্রিকা থেকে তাজা সংবাদ সংগ্রহ করা হচ্ছে...
        </div>
      `;

      // ১০টি পত্রিকার রিকোয়েস্ট একসাথে পাঠানো
      const promises = NEWSPAPERS.map(paper => fetchPaperNews(paper));
      const results = await Promise.all(promises);
      const validNews = results.filter(item => item !== null && item.title.length > 0);

      if (validNews.length === 0) {
        container.innerHTML = `
          <div class="col-span-full bg-rose-50 border border-rose-200 text-rose-700 p-6 rounded-2xl text-center text-sm">
            সংবাদ সংগ্রহ করতে সাময়িক সমস্যা হয়েছে। কিছুক্ষণ পর রিফ্রেশ করুন।
          </div>
        `;
        return;
      }

      countBadge.innerText = `${toBnNum(validNews.length)}টি পত্রিকা সফলভাবে সংযুক্ত`;

      // কার্ড রেন্ডার
      container.innerHTML = validNews.map((item, index) => {
        const timeText = formatBengaliTime(item.pubDate);

        return `
          <a href="${item.link}" target="_blank" rel="noopener noreferrer" 
             class="group bg-white rounded-2xl p-5 border border-slate-200 hover:border-rose-300 hover:shadow-lg transition duration-200 flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between gap-2 mb-3">
                <span class="px-2.5 py-0.5 rounded-full text-xs font-bold border ${item.badge}">
                  ${item.paperName}
                </span>
                <span class="text-xs font-semibold text-slate-400 bg-slate-50 px-2 py-0.5 rounded-md">
                  #${toBnNum(index + 1)}
                </span>
              </div>
              <h3 class="text-base sm:text-lg font-bold text-slate-900 group-hover:text-rose-600 transition leading-snug line-clamp-3">
                ${item.title}
              </h3>
            </div>
            <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
              <span>• ${timeText}</span>
              <span class="font-semibold text-rose-600 group-hover:underline inline-flex items-center gap-1">
                মূল খবর পড়ুন <span>→</span>
              </span>
            </div>
          </a>
        `;
      }).join('');

      timeLabel.innerText = 'সর্বশেষ আপডেট: ' + formatBengaliTime(new Date());
    }

    // রান করা
    fetchTop10Papers();

    // প্রতি ৫ মিনিট পর পর অটো-রিফ্রেশ
    setInterval(fetchTop10Papers, 300000);
  </script>
</body>
</html>
