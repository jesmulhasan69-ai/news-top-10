<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>শীর্ষ সংবাদ গ্রিড | থাম্বনেইল সহ লাইভ আপডেট</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- বাংলা ফন্ট -->
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Hind Siliguri', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen antialiased">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight flex items-center gap-2">
          <span class="inline-block w-3 h-3 rounded-full bg-rose-600 animate-ping"></span>
          দেশসেরা শীর্ষ ১০ সংবাদ
        </h1>
        <p class="text-xs text-slate-500 mt-0.5">বিবিসি বাংলা, প্রথম আলো ও বিডিনিউজ২৪-এর সমন্বিত বুলেটিন</p>
      </div>
      <button onclick="fetchAllNews()" class="bg-slate-900 hover:bg-slate-800 active:scale-95 text-white text-xs sm:text-sm font-medium px-4 py-2 rounded-xl transition flex items-center gap-2 shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-rose-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        <span>রিফ্রেশ</span>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-6 pb-3 border-b border-slate-200">
      <div class="text-sm font-semibold text-slate-600 flex items-center gap-2">
        <span>সর্বশেষ প্রকাশিত সংবাদসমূহ</span>
        <span class="text-xs bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full font-medium">১০টি আইটেম</span>
      </div>
      <span id="update-time" class="text-xs text-slate-500 bg-white border border-slate-200 px-3 py-1 rounded-full shadow-sm w-fit">
        আপডেট হচ্ছে...
      </span>
    </div>

    <!-- News Grid Container -->
    <div id="news-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Loading Skeleton Cards -->
      <div class="bg-white rounded-2xl overflow-hidden border border-slate-200/70 p-4 animate-pulse space-y-3">
        <div class="h-44 bg-slate-200 rounded-xl"></div>
        <div class="h-5 bg-slate-200 rounded w-3/4"></div>
        <div class="h-4 bg-slate-200 rounded w-1/2"></div>
      </div>
      <div class="bg-white rounded-2xl overflow-hidden border border-slate-200/70 p-4 animate-pulse space-y-3">
        <div class="h-44 bg-slate-200 rounded-xl"></div>
        <div class="h-5 bg-slate-200 rounded w-3/4"></div>
        <div class="h-4 bg-slate-200 rounded w-1/2"></div>
      </div>
      <div class="bg-white rounded-2xl overflow-hidden border border-slate-200/70 p-4 animate-pulse space-y-3">
        <div class="h-44 bg-slate-200 rounded-xl"></div>
        <div class="h-5 bg-slate-200 rounded w-3/4"></div>
        <div class="h-4 bg-slate-200 rounded w-1/2"></div>
      </div>
    </div>
  </main>

  <script>
    // সংবাদ সোর্সের তালিকা
    const NEWS_SOURCES = [
      {
        name: 'বিবিসি বাংলা',
        badge: 'bg-rose-100 text-rose-800 border-rose-200',
        rss: 'https://feeds.bbci.co.uk/bengali/rss.xml'
      },
      {
        name: 'প্রথম আলো',
        badge: 'bg-blue-100 text-blue-800 border-blue-200',
        rss: 'https://www.prothomalo.com/feed'
      },
      {
        name: 'বিডিনিউজ২৪',
        badge: 'bg-emerald-100 text-emerald-800 border-emerald-200',
        rss: 'https://bangla.bdnews24.com/rss.xml'
      }
    ];

    // ইংরেজি সংখ্যা বাংলায় কনভার্ট
    function toBnNum(num) {
      const bn = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
      return String(num).replace(/[0-9]/g, d => bn[d]);
    }

    // বিভিন্ন আরএসএস ফিল্ড থেকে ছবি এক্সট্রাক্ট করার হেল্পার ফাংশন
    function extractImageUrl(item) {
      // ১. ডিরেক্ট thumbnail ফিল্ড
      if (item.thumbnail && typeof item.thumbnail === 'string' && item.thumbnail.startsWith('http')) {
        return item.thumbnail;
      }
      // ২. enclosure ফিল্ড (সরাসরি ইমেজ ফাইল লিঙ্ক)
      if (item.enclosure && item.enclosure.link && item.enclosure.type?.includes('image')) {
        return item.enclosure.link;
      }
      // ৩. description বা content HTML এর ভেতর থেকে <img> ট্যাগ খোঁজা
      const htmlContent = item.description || item.content || '';
      const imgMatch = htmlContent.match(/<img[^>]+src=["']([^"']+)["']/i);
      if (imgMatch && imgMatch[1]) {
        return imgMatch[1];
      }
      return null;
    }

    async function fetchAllNews() {
      const container = document.getElementById('news-grid');
      const timeLabel = document.getElementById('update-time');

      container.innerHTML = `
        <div class="col-span-full py-16 text-center text-slate-400">
          <svg class="animate-spin h-8 w-8 mx-auto mb-3 text-rose-600" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          সর্বশেষ সংবাদ এবং থাম্বনেইল লোড হচ্ছে...
        </div>
      `;

      try {
        const fetchTasks = NEWS_SOURCES.map(source => {
          const endpoint = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(source.rss)}`;
          return fetch(endpoint)
            .then(res => res.json())
            .then(data => {
              if (data.status === 'ok') {
                return data.items.map(item => ({
                  title: item.title,
                  link: item.link,
                  image: extractImageUrl(item),
                  pubDate: new Date(item.pubDate.replace(/-/g, '/')),
                  sourceName: source.name,
                  badgeClass: source.badge
                }));
              }
              return [];
            })
            .catch(() => []);
        });

        const results = await Promise.allSettled(fetchTasks);

        let allNews = [];
        results.forEach(res => {
          if (res.status === 'fulfilled' && Array.isArray(res.value)) {
            allNews = allNews.concat(res.value);
          }
        });

        // ডুপ্লিকেট বাদ দেওয়া
        const uniqueNews = [];
        const seenTitles = new Set();
        for (const item of allNews) {
          const cleanTitle = item.title.trim();
          if (!seenTitles.has(cleanTitle)) {
            seenTitles.add(cleanTitle);
            uniqueNews.push(item);
          }
        }

        // সময়ের ক্রমানুসারে সাজানো (নতুন সংবাদ আগে)
        uniqueNews.sort((a, b) => b.pubDate - a.pubDate);

        // শীর্ষ ১০টি সংবাদ নির্বাচন
        const top10 = uniqueNews.slice(0, 10);

        if (top10.length === 0) {
          throw new Error('No news found');
        }

        container.innerHTML = top10.map((item, index) => {
          const timeText = isNaN(item.pubDate.getTime()) 
            ? 'সাম্প্রতিক' 
            : item.pubDate.toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });

          // ছবি থাকলে ইমেজ ট্যাগ, না থাকলে সুন্দর ফলব্যাক কার্ড
          const mediaBlock = item.image 
            ? `
              <div class="relative w-full h-48 bg-slate-100 overflow-hidden">
                <img 
                  src="${item.image}" 
                  alt="${item.title}" 
                  loading="lazy"
                  class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                  onerror="this.parentElement.innerHTML='<div class=\\'w-full h-full flex items-center justify-center bg-slate-100 text-slate-400 text-xs font-semibold\\'>সংবাদ চিত্র</div>';"
                />
                <span class="absolute top-3 left-3 bg-slate-900/80 backdrop-blur-sm text-white text-xs font-bold px-2 py-0.5 rounded-md">
                  #${toBnNum(index + 1)}
                </span>
              </div>
            ` 
            : `
              <div class="relative w-full h-48 bg-gradient-to-br from-slate-100 to-slate-200 flex items-center justify-center p-6 text-center">
                <span class="absolute top-3 left-3 bg-slate-900/80 backdrop-blur-sm text-white text-xs font-bold px-2 py-0.5 rounded-md">
                  #${toBnNum(index + 1)}
                </span>
                <span class="text-slate-400 font-semibold text-sm">
                  ${item.sourceName}
                </span>
              </div>
            `;

          return `
            <a href="${item.link}" target="_blank" rel="noopener noreferrer"
               class="group bg-white rounded-2xl overflow-hidden border border-slate-200/80 hover:border-slate-300 hover:shadow-xl hover:-translate-y-1 transition duration-200 flex flex-col justify-between">
              <div>
                ${mediaBlock}
                <div class="p-5">
                  <div class="flex items-center gap-2 mb-2.5">
                    <span class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold border ${item.badgeClass}">
                      ${item.sourceName}
                    </span>
                    <span class="text-xs text-slate-400">• ${timeText}</span>
                  </div>
                  <h3 class="text-base sm:text-lg font-bold text-slate-900 group-hover:text-rose-600 transition leading-snug line-clamp-3">
                    ${item.title}
                  </h3>
                </div>
              </div>
              <div class="px-5 pb-5 pt-0">
                <div class="text-xs font-semibold text-rose-600 group-hover:translate-x-1 transition-transform inline-flex items-center gap-1">
                  মূল খবর পড়ুন <span>→</span>
                </div>
              </div>
            </a>
          `;
        }).join('');

        timeLabel.innerText = 'সর্বশেষ আপডেট: ' + new Date().toLocaleTimeString('bn-BD');

      } catch (err) {
        container.innerHTML = `
          <div class="col-span-full bg-rose-50 border border-rose-200 text-rose-700 p-6 rounded-2xl text-center text-sm">
            সংবাদ এবং থাম্বনেইল ফেচ করতে সমস্যা হয়েছে। অনুগ্রহ করে কিছুক্ষণ পর আবার চেষ্টা করুন।
          </div>
        `;
      }
    }

    // পেজ লোড হলে ফেচ হবে
    fetchAllNews();

    // প্রতি ৫ মিনিট পরপর অটো-রিফ্রেশ
    setInterval(fetchAllNews, 300000);
  </script>
</body>
</html>
