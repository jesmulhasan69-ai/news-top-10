<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>শীর্ষ ১০ পত্রিকার প্রধান শিরোনাম</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Hind Siliguri', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen antialiased">

  <!-- Header -->
  <header class="bg-slate-900 text-white sticky top-0 z-50 shadow-md border-b border-slate-800">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-xl sm:text-2xl font-bold tracking-tight flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-rose-600 animate-pulse"></span>
          ১০ পত্রিকার প্রধান শিরোনাম
        </h1>
        <p class="text-xs text-slate-400 mt-0.5">দেশের সেরা ১০টি সংবাদপত্রের এক পলকের লাইভ বুলেটিন</p>
      </div>
      <button onclick="loadRealtimeNews()" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 text-xs sm:text-sm font-semibold px-3.5 py-2 rounded-xl border border-slate-700 transition flex items-center gap-1.5 shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        <span>রিফ্রেশ</span>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
    <div class="flex items-center justify-between mb-6 pb-2 border-b border-slate-200">
      <div class="text-sm font-semibold text-slate-600 flex items-center gap-2">
        <span>শীর্ষ পত্রিকার লিড নিউজ</span>
        <span id="count-badge" class="text-xs bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full font-medium">লোড হচ্ছে...</span>
      </div>
      <span id="update-time" class="text-xs text-slate-500 bg-white border border-slate-200 px-3 py-1 rounded-full shadow-sm">
        আপডেট হচ্ছে...
      </span>
    </div>

    <!-- News Grid Container -->
    <div id="news-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="col-span-full py-16 text-center text-slate-400">
        <svg class="animate-spin h-8 w-8 mx-auto mb-3 text-rose-600" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
        রিয়েল-টাইম সংবাদ লোড হচ্ছে...
      </div>
    </div>
  </main>

  <script>
    function toBnNum(num) {
      const bn = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
      return String(num).replace(/[0-9]/g, d => bn[d]);
    }

    function formatBengaliTime(dateObj) {
      if (!dateObj || isNaN(dateObj.getTime())) return 'সাম্প্রতিক';
      let hours = dateObj.getHours();
      const minutes = dateObj.getMinutes().toString().padStart(2, '0');
      const isPM = hours >= 12;
      hours = hours % 12 || 12;
      return `${toBnNum(hours.toString().padStart(2, '0'))}:${toBnNum(minutes)} ${isPM ? 'PM' : 'AM'}`;
    }

    // নির্ভরযোগ্য ওপেন প্রক্সি ট্রাই করার ফাংশন
    async function fetchXmlFeed(url) {
      const proxies = [
        `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
        `https://corsproxy.io/?${encodeURIComponent(url)}`
      ];

      for (const proxyUrl of proxies) {
        try {
          const res = await fetch(proxyUrl);
          if (res.ok) {
            const xmlText = await res.text();
            if (xmlText && xmlText.includes('<rss')) {
              return xmlText;
            }
          }
        } catch (e) {
          // ট্রাই নেক্সট প্রক্সি
        }
      }
      throw new Error('সবগুলো প্রক্সি ব্যর্থ হয়েছে');
    }

    async function loadRealtimeNews() {
      const container = document.getElementById('news-grid');
      const timeLabel = document.getElementById('update-time');
      const countBadge = document.getElementById('count-badge');

      container.innerHTML = `
        <div class="col-span-full py-16 text-center text-slate-400">
          <svg class="animate-spin h-8 w-8 mx-auto mb-3 text-rose-600" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          রিয়েল-টাইম সংবাদ লোড হচ্ছে...
        </div>
      `;

      try {
        // ১টি মাত্র রিকোয়েস্টে গুগলের লাইভ বাংলা টপ স্টোরিজ ফিড
        const googleFeedUrl = 'https://news.google.com/rss?hl=bn&gl=BD&ceid=BD:bn';
        const xmlString = await fetchXmlFeed(googleFeedUrl);

        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlString, 'text/xml');
        const items = Array.from(xmlDoc.querySelectorAll('item'));

        if (!items || items.length === 0) {
          throw new Error('ফিডে কোনো সংবাদ পাওয়া যায়নি');
        }

        const selectedNews = [];
        const seenSources = new Set();

        for (const item of items) {
          const rawTitle = item.querySelector('title')?.textContent || '';
          const link = item.querySelector('link')?.textContent || '';
          const pubDateStr = item.querySelector('pubDate')?.textContent || '';
          const sourceElem = item.querySelector('source');
          
          let sourceName = sourceElem ? sourceElem.textContent.trim() : '';

          // শিরোনাম থেকে সোর্সের নাম আলাদা করা (টাইটেল - সোর্স)
          let title = rawTitle;
          if (rawTitle.includes(' - ')) {
            const parts = rawTitle.split(' - ');
            if (!sourceName) sourceName = parts.pop().trim();
            title = parts.join(' - ').trim();
          }

          if (!sourceName) sourceName = 'জাতীয় সংবাদ';

          // প্রতিটি সোর্স থেকে কেবল ১টি করে প্রধান সংবাদ নেওয়া হবে
          if (!seenSources.has(sourceName)) {
            seenSources.add(sourceName);
            selectedNews.push({
              source: sourceName,
              title: title,
              link: link,
              pubDate: pubDateStr ? new Date(pubDateStr) : new Date()
            });
          }

          // ঠিক ১০টি ভিন্ন পত্রিকার খবর নেওয়া হলে লুপ শেষ
          if (selectedNews.length === 10) break;
        }

        countBadge.innerText = `${toBnNum(selectedNews.length)}টি পত্রিকা লাইভ`;

        // কার্ড রেন্ডার করা
        container.innerHTML = selectedNews.map((item, index) => {
          const timeText = formatBengaliTime(item.pubDate);

          return `
            <a href="${item.link}" target="_blank" rel="noopener noreferrer" 
               class="group bg-white rounded-2xl p-5 border border-slate-200 hover:border-rose-400 hover:shadow-lg transition duration-200 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between gap-2 mb-3">
                  <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-rose-50 text-rose-700 border border-rose-200">
                    ${item.source}
                  </span>
                  <span class="text-xs font-semibold text-slate-400 bg-slate-50 px-2 py-0.5 rounded-md">
                    #${toBnNum(index + 1)}
                  </span>
                </div>
                <h3 class="text-base sm:text-lg font-bold text-slate-900 group-hover:text-rose-600 transition leading-snug line-clamp-3">
                  ${item.title}
                </h3>
              </div>
              <div class="mt-5 pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
                <span>• ${timeText}</span>
                <span class="font-semibold text-rose-600 group-hover:underline inline-flex items-center gap-1">
                  মূল খবর পড়ুন <span>→</span>
                </span>
              </div>
            </a>
          `;
        }).join('');

        timeLabel.innerText = 'সর্বশেষ আপডেট: ' + formatBengaliTime(new Date());

      } catch (err) {
        container.innerHTML = `
          <div class="col-span-full bg-rose-50 border border-rose-200 text-rose-700 p-6 rounded-2xl text-center text-sm">
            সংবাদ লোড করতে সমস্যা হয়েছে। অনুগ্রহ করে রিফ্রেশ বাটনে চাপুন।
          </div>
        `;
      }
    }

    // লোড হওয়া শুরু হবে
    loadRealtimeNews();

    // প্রতি ৫ মিনিট পরপর অটো-রিফ্রেশ
    setInterval(loadRealtimeNews, 300000);
  </script>
</body>
</html>
